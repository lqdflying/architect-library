<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #ffffff; overflow: hidden; }
    #root { display: inline-block; }
    #root svg { display: block; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    // The Excalidraw version is pinned so an upstream release can't silently
    // break rendering. We prefer a locally vendored copy (vendor/excalidraw.js)
    // so renders work without live network access; if it isn't present we fall
    // back to the pinned esm.sh build. See README "Setup" for the vendor step.
    const CDN_URL = "https://esm.sh/@excalidraw/excalidraw@0.17.6?bundle";
    const LOCAL_URL = "./vendor/excalidraw.js";

    let exportToSvg;
    try {
      ({ exportToSvg } = await import(LOCAL_URL));
      window.__excalidrawSource = "local";
    } catch (localErr) {
      try {
        ({ exportToSvg } = await import(CDN_URL));
        window.__excalidrawSource = "cdn";
      } catch (cdnErr) {
        // Surface a structured reason so the Python side can print a helpful
        // message instead of just hanging until the readiness timeout fires.
        window.__moduleError =
          "Could not load the Excalidraw library. " +
          "local (" + LOCAL_URL + "): " + (localErr && localErr.message) + "; " +
          "cdn (" + CDN_URL + "): " + (cdnErr && cdnErr.message);
        throw cdnErr;
      }
    }

    window.renderDiagram = async function(jsonData) {
      try {
        const data = typeof jsonData === "string" ? JSON.parse(jsonData) : jsonData;
        const elements = data.elements || [];
        const appState = data.appState || {};
        const files = data.files || {};

        // Force white background in appState
        appState.viewBackgroundColor = appState.viewBackgroundColor || "#ffffff";
        appState.exportWithDarkMode = false;

        const svg = await exportToSvg({
          elements: elements,
          appState: {
            ...appState,
            exportBackground: true,
          },
          files: files,
        });

        // Clear any previous render
        const root = document.getElementById("root");
        root.innerHTML = "";
        root.appendChild(svg);

        window.__renderComplete = true;
        window.__renderError = null;
        return { success: true, width: svg.getAttribute("width"), height: svg.getAttribute("height") };
      } catch (err) {
        window.__renderComplete = true;
        window.__renderError = err.message;
        return { success: false, error: err.message };
      }
    };

    // Signal that the module is loaded and ready
    window.__moduleReady = true;
  </script>
</body>
</html>
